<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeReading</title>
  <link rel="stylesheet" href="./runtime/v2-runtime.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main data-vr-scene class="vr-scene">
    <div data-vr-weather class="vr-weather-layer" aria-hidden="true"></div>
  </main>

  <section data-vr-guide class="vr-guide" aria-label="Pre-reading guide">
    <div data-vr-guide-art class="vr-guide-art" aria-hidden="true"></div>
    <div data-vr-guide-focus class="vr-guide-focus" aria-hidden="true"></div>
    <div class="vr-guide-content">
      <p data-vr-guide-eyebrow class="vr-guide-eyebrow">A brief moment before reading</p>
      <h1 data-vr-book-title class="vr-guide-title">VibeReading</h1>
      <p data-vr-guide-invitation class="vr-guide-invitation">Put on your headphones and take a few seconds to settle into this book.</p>
      <p data-vr-guide-text></p>
      <p data-vr-guide-emphasis class="vr-guide-emphasis"></p>
      <div class="vr-guide-actions">
        <button type="button" data-vr-guide-start class="vr-button vr-button--primary">Begin</button>
        <button type="button" data-vr-guide-next class="vr-button vr-button--primary" hidden>Continue</button>
      </div>
      <button type="button" data-vr-guide-skip class="vr-guide-skip" hidden>Skip to reading space</button>
    </div>
  </section>

  <script src="./runtime/libs/p5.min.js"></script>
  <script src="./app.js"></script>
  <script src="./runtime/v2-runtime.js"></script>
</body>
</html>
