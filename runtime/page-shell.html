<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeReading</title>
  <link rel="stylesheet" href="./runtime/v2-runtime.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main data-vr-shell class="vr-shell">
    <section data-vr-scene class="vr-scene" aria-label="Reading space">
      <div data-vr-scene-underlay class="vr-scene-underlay"></div>
      <div data-vr-weather class="vr-weather-layer" aria-hidden="true"></div>
      <div data-vr-atmosphere-slot class="vr-atmosphere-slot" aria-hidden="true"></div>
      <div data-vr-scene-slot class="vr-scene-slot"></div>
    </section>

    <!-- Agent authors template-specific controls here; the shared shell provides no panel skin. -->
    <section data-vr-companion-root class="vr-companion-root" aria-label="Reading controls"></section>
  </main>

  <section data-vr-guide class="vr-guide" aria-label="Pre-reading guide">
    <!-- Agent authors the book-specific guide hierarchy and Chinese control labels here. -->
    <div data-vr-guide-root class="vr-guide-root"></div>
  </section>

  <script src="./runtime/libs/p5.min.js"></script>
  <script src="./app.js"></script>
  <script src="./runtime/v2-runtime.js"></script>
</body>
</html>
